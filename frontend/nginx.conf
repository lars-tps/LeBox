server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large request bodies just in case (uploads go directly to S3 anyway).
    client_max_body_size 50m;

    # SPA fallback — unknown paths serve index.html so React Router (if added) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api to the backend service. The host name "backend" matches
    # both the docker-compose service name and the k8s Service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
